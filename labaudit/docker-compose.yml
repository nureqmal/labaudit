version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: labaudit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     labaudit
      POSTGRES_PASSWORD: labaudit_pass
      POSTGRES_DB:       labaudit_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labaudit -d labaudit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── LabAudit App ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labaudit_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://labaudit:labaudit_pass@db:5432/labaudit_db
    ports:
      - "8501:8501"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
